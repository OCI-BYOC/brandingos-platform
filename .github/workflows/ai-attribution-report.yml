name: Weekly AI Attribution Report

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

jobs:
  report:
    name: Generate Weekly Report
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and post report
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const since = new Date(Date.now() - 7*24*60*60*1000).toISOString();
            const commits = execSync(`git log --since="${since}" --format="%H"`).toString().trim().split('\n').filter(Boolean);

            const agents = {}, members = {};
            let totalAI = 0;

            for (const hash of commits) {
              const msg = execSync(`git log --format="%B" -n 1 ${hash}`).toString();
              if (/^(Merge|fixup|squash)/.test(msg)) continue;

              const agent = (msg.match(/^AI-Agent:\s*(.+)/m) || [])[1]?.split('/')[0]?.trim();
              const by = (msg.match(/^Built-By:\s*(.+)/m) || [])[1]?.trim();
              const ref = (msg.match(/^Refs:\s*(.+)/m) || [])[1]?.trim();

              if (agent && agent !== 'none') {
                agents[agent] = (agents[agent] || 0) + 1;
                totalAI++;
              }
              if (by) members[by] = (members[by] || 0) + 1;
            }

            const week = new Date().toISOString().slice(0,10);
            const agentTable = Object.entries(agents).map(([a,c]) => `| \`${a}\` | ${c} |`).join('\n');
            const memberTable = Object.entries(members).map(([m,c]) => `| ${m} | ${c} |`).join('\n');

            const body = `## AI Attribution Report — ${week}\n\n**Commits:** ${commits.length} total, ${totalAI} AI-assisted\n\n### By Agent\n| Agent | Commits |\n|---|---|\n${agentTable}\n\n### By Member\n| Member | Commits |\n|---|---|\n${memberTable}\n\n*Auto-generated every Monday 9AM IST*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `AI Attribution Report — ${week}`,
              labels: ['ai-attribution-report'],
              body
            });
