name: Commit Lint — AI Attribution Enforcement

on:
  pull_request:
    branches: [develop, main]

jobs:
  commitlint:
    name: Validate Commits + AI Attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run commitlint
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.ts
          failOnWarnings: false
      - name: Validate AI attribution
        run: |
          COMMITS=$(git log origin/develop..HEAD --format="%H")
          FAILED=0
          while IFS= read -r hash; do
            [ -z "$hash" ] && continue
            MSG=$(git log --format="%B" -n 1 "$hash")
            echo "$MSG" | grep -qE "^(Merge|fixup!|squash!)" && continue
            MISSING=""
            echo "$MSG" | grep -q "^AI-Agent:" || MISSING="$MISSING\n  Missing: AI-Agent"
            echo "$MSG" | grep -qP "^Built-By:\s*(Satyam|Aditya|Soumyadip)$" || MISSING="$MISSING\n  Missing/Invalid: Built-By"
            echo "$MSG" | grep -q "^Why:" || MISSING="$MISSING\n  Missing: Why"
            echo "$MSG" | grep -q "^How:" || MISSING="$MISSING\n  Missing: How"
            echo "$MSG" | grep -q "^Time-Spent:" || MISSING="$MISSING\n  Missing: Time-Spent"
            echo "$MSG" | grep -qP "^Refs:\s*#\d+" || MISSING="$MISSING\n  Missing: Refs"
            if [ -n "$MISSING" ]; then
              echo "FAIL in commit $hash:$MISSING"
              FAILED=1
            else
              AI=$(echo "$MSG" | grep "^AI-Agent:" | sed 's/AI-Agent: //')
              BY=$(echo "$MSG" | grep "^Built-By:" | sed 's/Built-By: //')
              echo "OK: $hash | $AI | $BY"
            fi
          done <<< "$COMMITS"
          [ $FAILED -eq 1 ] && echo "BLOCKED: Fix commit attribution. See .github/COMMIT_CONVENTION.md" && exit 1
          echo "All commits have valid AI attribution"
